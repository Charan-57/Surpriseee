<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"><title>Happy Girlfriend's Day ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 font-family:'Poppins',sans-serif;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:flex-start;
 padding:20px;
 overflow-x:hidden;
 background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
 background-size:400% 400%;
 animation:bg 12s ease infinite;
}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}

.card{
 position:relative;
 width:min(95vw,430px);
 background:rgba(255,255,255,.22);
 backdrop-filter:blur(20px);
 border-radius:30px;
 padding:28px 22px 40px;
 text-align:center;
 box-shadow:0 18px 45px rgba(0,0,0,.25);
 margin-bottom:20px;
}
.emoji{font-size:54px}
.slider{
 width:100%;
 max-width:300px;
 aspect-ratio:3/4;
 margin:20px auto;
 position:relative;
 overflow:hidden;
 border-radius:22px;
 box-shadow:0 15px 30px rgba(0,0,0,.25);
}
.slide{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 opacity:0;
 transition:.8s;
}
.slide.active{opacity:1}
h1{
    font-family:'Great Vibes',cursive;
    font-size:64px;
    color:#d81b60;
    font-weight:400;
    margin:15px 0 10px;
    text-shadow:0 5px 18px rgba(255,105,180,.35);
}
#typing{
    min-height:30px;
    color:#d63384;
    font-size:20px;
    font-weight:600;
    margin-bottom:20px;
    margin:10px 0 25px;
}
.quote{
    width:100%;
    text-align:left;
    line-height:1.9;
    color:#6d214f;
    font-size:17px;
    font-weight:400;
}
.float{
 position:fixed;
 pointer-events:none;
 animation:rise 7s linear forwards;
}
@keyframes rise{
 from{transform:translateY(0) scale(.8);opacity:1}
 to{transform:translateY(-120vh) scale(1.6);opacity:0}
}
@media(max-width:600px){
 .card{padding:24px 18px 34px}
 h1{font-size:1.9rem}
 .slider{max-width:280px}
 .quote{font-size:.98rem}
}
</style>
</head>
<body>
<div class="card">
<div class="emoji">🫶💖</div>

<div class="slider">
<img class="slide active" src="1.jpeg">
<img class="slide" src="2.jpeg">
<img class="slide" src="3.jpeg">
<img class="slide" src="4.jpeg">
<img class="slide" src="5.jpeg">
<img class="slide" src="6.jpeg">
<img class="slide" src="7.jpeg">
<img class="slide" src="8.jpeg">
<img class="slide" src="9.jpeg">
<img class="slide" src="10.jpeg">
<img class="slide" src="12.jpeg">
<img class="slide" src="13.jpeg">
</div>

<h1>Vaishuuu ❤️</h1>
<div id="typing"></div>

<div class="quote" id="quote"></div>
</div>

<script>
const msgs=[
"Happy Girlfriend's Day Bangarammm💕",
"You make my life beautiful🌸",
"Love you till the end❤️"
];
let i=0,j=0;
function type(){
 const el=document.getElementById("typing");
 if(j<=msgs[i].length){
   el.textContent=msgs[i].slice(0,j++);
   setTimeout(type,80);
 }else{
   setTimeout(()=>{
     j=0;
     i=(i+1)%msgs.length;
     el.textContent="";
     type();
   },1800);
 }
}
type();

document.getElementById("quote").innerHTML=`
Dear Vaishu💖,<br><br>
Thank you for making my life brighter, my heart happier, and my world more beautiful💝.<br><br>
Loving u since many years, will love u till the end🫶.<br><br>
I proudly and happily say that in all this chaos in my life you're the BEST THING that happened to me🎁💞.<br><br>
I love You❤️
`;

const slides=document.querySelectorAll(".slide");
const effects=["translateX(100%)","translateX(-100%)","scale(1.3)","rotate(8deg)","scale(.8)"];
let current=0;
setInterval(()=>{
 slides[current].classList.remove("active");
 current=(current+1)%slides.length;
 slides[current].style.transform=effects[current%effects.length];
 slides[current].classList.add("active");
 setTimeout(()=>slides[current].style.transform="none",50);
},3500);

setInterval(()=>{
 let e=document.createElement("div");
 e.className="float";
 e.innerHTML=["❤️","💖","🌸","✨"][Math.floor(Math.random()*4)];
 e.style.left=Math.random()*100+"vw";
 e.style.bottom="-20px";
 e.style.fontSize=(20+Math.random()*25)+"px";
 document.body.appendChild(e);
 setTimeout(()=>e.remove(),7000);
},700);
</script>
</body>
</html>
